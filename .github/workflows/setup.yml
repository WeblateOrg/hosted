name: Distribution

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
    - name: build
      run: uv build
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        path: dist/*
        name: dist
        if-no-files-found: error

  lint:
    name: Lint packages
    runs-on: ubuntu-26.04
    needs:
    - setup
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.15'
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: 0.13.7
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist
    - name: twine
      run: uv run --frozen --only-group package-lint twine check dist/*.tar.gz dist/*.whl
    - name: pydistcheck
      run: uv run --frozen --only-group package-lint pydistcheck --inspect dist/*.tar.gz dist/*.whl
    - name: pyroma
      run: uv run --frozen --only-group package-lint pyroma dist/*.tar.gz
    - name: check-wheel-contents
      run: uv run --frozen --only-group package-lint check-wheel-contents dist/*.whl
    - name: check-manifest
      run: uv run --frozen --only-group package-lint check-manifest -v

  release_pypi:
    name: Publish release to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'WeblateOrg/hosted'
    runs-on: ubuntu-26.04
    environment: pypi
    permissions:
      id-token: write
    needs:
    - lint
    - setup
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist
        path: dist
    - name: Publish packages with attestations
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        attestations: true
